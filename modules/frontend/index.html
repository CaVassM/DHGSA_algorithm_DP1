<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Configuración de despliegue (dirección del backend). Va en <head> y
         ANTES de cualquier otra cosa a propósito: es un script clásico, así que
         se ejecuta durante el parseo, mientras que el bundle de la aplicación
         es un módulo (diferido) y corre después. Así window.__TASF_BACKEND_URL__
         ya está definido cuando la app lo lee.

         Queda FUERA del bundle: se copia tal cual a dist/, de modo que en el
         servidor (contenedor, S3, EC2) se puede apuntar a otro backend sin
         recompilar. Ver public/config.js. -->
    <script src="/config.js"></script>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Tasf.B2B — Gestión de Equipajes</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
